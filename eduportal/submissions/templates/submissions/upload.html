{% extends 'submissions/base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-12 bg-slate-950 border border-slate-800 rounded-xl p-6 shadow-2xl">
    <h2 class="text-xl font-bold text-white mb-1">Student Portal Sandbox</h2>
    <p class="text-slate-400 text-sm mb-6">Drop unorganized raw coursework directly into the server stream.</p>

    <form method="POST" enctype="multipart/form-data" class="space-y-5">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2">Full Name</label>
            <input type="text" name="student_name" required placeholder="Alice Smith" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-4 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
        </div>
        
        <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2">Assignment Attachment File</label>
            <input type="file" name="student_file" required class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600/10 file:text-indigo-400 hover:file:bg-indigo-600/20 file:transition cursor-pointer">
        </div>

        <button type="submit" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition shadow-lg shadow-indigo-950/50">Transmit Assignment File</button>
    </form>
</div>
{% endblock %}
