<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduDrive - Control Room</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
    <nav class="border-b border-slate-800 bg-slate-950 px-6 py-4 flex justify-between items-center shadow-md">
        <a href="{% url 'dashboard' %}" class="text-xl font-bold tracking-tight text-indigo-400">🎓 EduDrive <span class="text-xs text-slate-500 font-mono">CORE</span></a>
        <div class="space-x-6">
            <a href="{% url 'dashboard' %}" class="text-sm font-medium hover:text-indigo-400 transition">Control Room</a>
            <a href="{% url 'upload_file' %}" class="bg-indigo-600 hover:bg-indigo-500 text-sm font-medium px-4 py-2 rounded-lg transition shadow-md shadow-indigo-950/40">Student Upload</a>
        </div>
    </nav>
    <main class="max-w-6xl mx-auto p-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
